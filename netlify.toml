# Netlify deployment configuration.
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The site is fully static: `nuxt generate` prerenders every route (including
# /sitemap.xml and /robots.txt via nitro.prerender in nuxt.config.ts) into
# .output/public, which is what gets published.

[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  # Must satisfy nuxt's engines: ^20.19.0 || >=22.12.0
  NODE_VERSION = "22"
  # The build needs devDependencies (nuxt, @nuxtjs/i18n, sass, sharp). Netlify
  # installs them by default; this only matters if NODE_ENV is ever forced to
  # production at build time.
  NPM_CONFIG_PRODUCTION = "false"

# --- Security headers ---------------------------------------------------------
# No Content-Security-Policy here on purpose: the site embeds an OpenStreetMap
# iframe and opens wa.me links, so a CSP needs per-source tuning rather than a
# guess. Add one deliberately if you want it. (Web fonts are self-hosted under
# /fonts, so no third-party font origin is needed.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# --- Caching -------------------------------------------------------------------
# Hashed build output never changes under a given filename.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand art and image derivatives are versioned by filename, not by hash, so use
# a long-but-not-immutable window: a replaced photo reuses its name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Image derivatives generated at build time by @nuxt/image.
[[headers]]
  for = "/_ipx/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Self-hosted web fonts (see assets/scss/_fonts.scss). Filenames are stable, so
# use the same long-but-not-immutable window as the images.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Per-locale payload files for client-side navigation.
[[headers]]
  for = "/_i18n/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SEO endpoints should be picked up promptly after a deploy.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- Web app manifest ----------------------------------------------------------
# Netlify's MIME table does not map `.webmanifest` to the media type the spec
# requires (it falls back to application/octet-stream), which can stop Chrome
# from accepting the manifest and thus from offering install. Declaring it
# explicitly is a no-op if the MIME table is ever fixed.
# Cache is deliberately revalidated rather than long-lived so a manifest change
# is picked up promptly on the next visit.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Deploy previews / branch deploys -----------------------------------------
# Never let a preview URL be indexed, and keep it out of the sitemap's reach.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex, nofollow"

# --- URL normalisation ---------------------------------------------------------
# The canonical URLs the site advertises carry no trailing slash (see the
# canonical/hreflang tags and the sitemap). `nitro.prerender.autoSubfolderIndex`
# is off, so a route is emitted as `services.html` — which Netlify serves at
# `/services` with a 200 and no redirect — instead of `services/index.html`,
# which Netlify answers with a 301 to `/services/`. Anything requested with a
# trailing slash is sent to that canonical form.
#
# The catch-all rule is REQUIRED, not decorative. Leaving a request unmatched
# makes Netlify answer with a 301 to the *same* URL, so an unknown path spins
# until the browser gives up ("Maximum (5) redirects followed" — reproduced on
# a Netlify deploy). Resolving the miss explicitly to /404.html with a 404
# status makes every request terminate in a real status code.
#
# `force` is omitted on both rules on purpose: a request that does match a file
# is still served the file, so /services, /sitemap.xml, the hashed assets and
# the _ipx variants are never affected.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
